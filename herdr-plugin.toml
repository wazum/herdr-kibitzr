id = "wazum.kibitzr"
name = "kibitzr"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux"]
description = "Asks your coding agent to review the comments it just wrote, so what explains something stays and the noise goes."

[[build]]
command = ["bash", "herdr/install.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-kibitzr\""]
